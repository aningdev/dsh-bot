[package]
name = "dsh-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nsh-core = "=0.3.0"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-tungstenite = "0.28"
url = "2"
serde_json = "1"
libc = "0.2"
libloading = "0.8"
dsh-host = { path = "../host" }
