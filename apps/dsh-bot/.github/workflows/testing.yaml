name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm --dir apps/dsh-bot install --frozen-lockfile
      - name: Run unit tests
        run: pnpm --dir apps/dsh-bot run test:unit

  test-e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm --dir apps/dsh-bot install --frozen-lockfile

      - name: Install Electron binary
        run: pnpm --dir apps/dsh-bot exec electron --version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright Browsers
        run: pnpm --dir apps/dsh-bot exec playwright install --with-deps chromium

      - name: Create Executable
        run: pnpm --dir apps/dsh-bot run package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Playwright tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm --dir apps/dsh-bot run test:e2e

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dsh-bot/playwright-report/
          retention-days: 7
