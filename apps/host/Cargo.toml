[package]
name = "dsh-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
getrandom = "0.3"
tempfile = "3"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "time", "rt-multi-thread", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
url = "2"
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
axum = "0.8"
dsh-relay = { path = "../relay" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
