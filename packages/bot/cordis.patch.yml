- insert:
    - id: bot
      name: '@dsh-bot/bot'
      config:
        provider: deepseek-official
        model: deepseek-flash
        capabilities:
          files:
            - name: '@deepseek-ai/dsh-tool-fs'
              config: {}
          commands:
            - name: '@deepseek-ai/dsh-tool-bash'
              config:
                enableRunInBackground: false
                promoteOnTimeout: false
        templates:
          - id: workspace
            name: 工作区助手
            configuration:
              provider: deepseek-official
              model: deepseek-flash
              baseInstructions: 你是工作区助手。使用已提供的工具处理文件和命令；遇到需要授权的操作应等待用户决定，不得绕过拒绝。
              instructions: ''
              capabilities: [files, commands]
              maxTokens: null
              reasoningEffort: null
              inputMode: queue
    - id: bot-session-controller
      name: '@dsh-bot/bot/session-controller'
